<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>zzjiang的前端网页作品集</title>
    <link rel="stylesheet" href="style.css">
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
        integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg=="
        crossorigin="anonymous"
        referrerpolicy="no-referrer"
    />
</head>
<body>
    <div class="container">
        <header>
            <!-- 删除刀叉图标 -->
            <h1>zzjiang的前端网页作品集</h1>
            <p>这是我的前端网页作品集，点击跳转到具体的页面！ </p>
        </header>

        <div id="meals" class="meals-container">
            <div class="meal" data-url="https://quiz-game-suimu312.vercel.app/">
                <img src="img/quiztime.png" alt="Quiz Time">
                <div class="meal-info">
                    <h3 class="meal-title">Quiz Time</h3>
                    <div class="meal-category">Quiz</div>
                </div>
            </div>
            <div class="meal" data-url="https://register-web-rho.vercel.app">
                <img src="img/register.png" alt="Register Form">
                <div class="meal-info">
                    <h3 class="meal-title">Register Form</h3>
                    <div class="meal-category">Register</div>
                </div>
            </div>
            <div class="meal" data-url="https://menu-searcher-green.vercel.app">
                <img src="img/recipe.png" alt="Recipe Finder">
                <div class="meal-info">
                    <h3 class="meal-title">Recipe Finder</h3>
                    <div class="meal-category">Recipe</div>
                </div>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
